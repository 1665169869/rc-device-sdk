[package]
name = "rc-device"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "125 kHz TEMIC 门锁卡读写器 + 身份证读卡器的 Rust SDK（Windows）"
readme = "README.md"

# 硬件层 SDK：只做设备 I/O，不含任何业务规则、不访问数据库。
[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
# 动态加载 LC32RFRW.dll。该驱动只有 x86 版本，宿主必须按 i686 构建。
libloading = "0.8"
# 身份证读卡服务的 WebSocket 客户端。
# 只连本机 `ws://127.0.0.1:9001`，因此关掉默认 TLS，不引入 rustls/native-tls；
# 同步阻塞实现，与设备层现有的「Mutex 串行 + 同步调用」风格一致，不拉 tokio 运行时。
# 钉在 0.29：0.30 要求 rustc 1.85，而本 crate 声明 rust-version 1.77。
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
